<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lumina – Portal da Coordenação." />
  <title>Lumina – Coordenação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar sidebar--coord" id="sidebar" role="navigation" aria-label="Menu principal">
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="20" height="20">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Lumina</div>
          <div class="brand-tag">Coordenação</div>
        </div>
      </div>
      <nav class="sidebar-nav" aria-label="Seções">
        <div class="nav-section-label">Principal</div>
        <div class="nav-item" data-view="welcome" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Início</span>
        </div>
        <div class="nav-section-label">Gestão</div>
        <div class="nav-item" data-view="teachers" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Professores</span>
        </div>
        <div class="nav-item" data-view="students" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Alunos</span>
        </div>
        <div class="nav-item" data-view="classes" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>Turmas</span>
        </div>
        <div class="nav-section-label">Sistema</div>
        <div class="nav-item" data-view="settings" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Configurações</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-teacher">
          <div class="teacher-avatar coord-avatar" aria-hidden="true">
            <span data-coord-avatar></span>
          </div>
          <div class="teacher-info">
            <div class="name" data-coord-name>…</div>
            <div class="subject" data-coord-role>Coordenação</div>
          </div>
          <button class="logout-btn" id="logout-btn" title="Sair" aria-label="Sair da conta">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <div class="main-wrapper">
      <header class="topbar topbar--coord" role="banner">
        <button id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">Portal da Coordenação</span>
        <div class="topbar-actions">
          <div class="topbar-avatar coord-avatar" aria-hidden="true">
            <span data-coord-avatar></span>
          </div>
          <span class="topbar-name" data-coord-name></span>
        </div>
      </header>
      <main id="main-content" role="main" aria-live="polite">
        <p class="loading-message">Carregando…</p>
      </main>
    </div>
  </div>
  <!-- Modal placeholder -->
  <div id="coord-modal" class="modal-overlay" style="display:none" aria-hidden="true">
    <div class="modal-box" id="coord-modal-box"></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/coordination-app.js"></script>
  <script>
    document.querySelectorAll('.nav-item[role="button"]').forEach((el) => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
      });
    });
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    if (menuToggle && sidebar) {
      const observer = new MutationObserver(() => {
        menuToggle.setAttribute('aria-expanded', sidebar.classList.contains('sidebar--open').toString());
      });
      observer.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
    }
  </script>
</body>
</html>
