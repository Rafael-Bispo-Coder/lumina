<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina | Gestão Escolar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-blur"></div>
    <main id="app" class="app-shell">
      <section class="hero">
        <h1>Lumina</h1>
        <p>Plataforma de gestão escolar para coordenação, professores e alunos.</p>
      </section>

      <section class="card" id="auth-card">
        <div class="tabs" role="tablist" aria-label="Autenticação">
          <button id="tab-login" class="tab active" data-tab="login" role="tab" aria-selected="true">Entrar</button>
          <button id="tab-invite" class="tab" data-tab="invite" role="tab" aria-selected="false">Cadastro por convite</button>
        </div>

        <form id="login-form" class="panel active" autocomplete="on">
          <label>Email
            <input id="login-email" type="email" required placeholder="seu@email.com" />
          </label>
          <label>Senha
            <input id="login-password" type="password" required minlength="8" />
          </label>
          <button type="submit" class="btn primary">Entrar</button>
          <p class="hint">Acesso inicial coordenação: <code>coord@lumina.local</code> / <code>Coord#1234</code></p>
        </form>

        <form id="invite-form" class="panel" autocomplete="off">
          <label>Código de convite
            <input id="invite-code" type="text" required placeholder="Ex.: LUMINA-ALUNO-001" />
          </label>
          <label>Nome completo
            <input id="invite-name" type="text" required />
          </label>
          <label>Email
            <input id="invite-email" type="email" required />
          </label>
          <label>Senha forte
            <input id="invite-password" type="password" required minlength="8" />
          </label>
          <button type="submit" class="btn primary">Criar conta</button>
        </form>

        <p id="auth-message" class="message" aria-live="polite"></p>
      </section>

      <section id="dashboard" class="dashboard hidden" aria-live="polite">
        <header class="dashboard-header card">
          <div>
            <h2 id="welcome-title">Painel</h2>
            <p id="welcome-subtitle"></p>
          </div>
          <button id="logout-btn" class="btn">Sair</button>
        </header>

        <nav id="dashboard-nav" class="card nav"></nav>
        <section id="dashboard-content" class="card content"></section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
