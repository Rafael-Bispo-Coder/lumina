<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lumina – Plataforma educacional para professores. Faça login para acessar suas turmas, vídeos e quizzes." />
  <title>Lumina – Login</title>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">

  <main class="login-card" role="main">

    <!-- Logo / branding -->
    <div class="login-logo">
      <div class="login-logo-icon" aria-hidden="true">
        <!-- Lumina star icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
             stroke-linejoin="round" width="32" height="32">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <h1>Lumina</h1>
      <p>Plataforma educacional para professores</p>
    </div>

    <!-- Error message (hidden initially) -->
    <div id="login-error" class="login-error" role="alert" aria-live="polite" hidden></div>

    <!-- Login form -->
    <form id="login-form" class="login-form" novalidate autocomplete="on">

      <div class="form-group">
        <label for="username">Usuário</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ex.: ana.silva"
            autocomplete="username"
            required
            aria-required="true"
            aria-describedby="username-hint"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
            aria-required="true"
          />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Mostrar senha">
            <!-- Eye icon -->
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (hidden by default) -->
            <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Entrar</span>
      </button>

    </form>

    <!-- Demo credentials hint -->
    <div class="demo-hint" aria-label="Credenciais de demonstração">
      <p>🔑 Credenciais de demonstração:</p>
      <p><code>ana.silva</code> / <code>senha123</code></p>
      <p><code>carlos.mendes</code> / <code>senha456</code></p>
      <p><code>beatriz.costa</code> / <code>senha789</code></p>
    </div>

  </main>

  <!-- Scripts (data first, then auth, then app logic) -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /**
     * Login page controller.
     * Handles form submission, loading state, show/hide password.
     */
    (function () {
      'use strict';

      // Redirect to dashboard if already logged in
      if (Auth.getCurrentTeacher()) {
        window.location.replace('dashboard.html');
      }

      const form    = document.getElementById('login-form');
      const btn     = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');
      const pwInput = document.getElementById('password');
      const toggleBtn  = document.getElementById('toggle-pw');
      const eyeIcon    = document.getElementById('eye-icon');
      const eyeOffIcon = document.getElementById('eye-off-icon');

      /* Show/hide password */
      toggleBtn.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type           = isHidden ? 'text' : 'password';
        eyeIcon.style.display    = isHidden ? 'none'  : '';
        eyeOffIcon.style.display = isHidden ? ''      : 'none';
        toggleBtn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
      });

      /* Form submit */
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = pwInput.value;

        // Show loading state
        btn.disabled = true;
        btn.classList.add('loading');
        errorEl.hidden = true;

        // Simulate a brief network delay for realism
        setTimeout(() => {
          const result = Auth.login(username, password);

          if (result.success) {
            window.location.href = 'dashboard.html';
          } else {
            errorEl.textContent = result.error;
            errorEl.hidden      = false;
            btn.disabled        = false;
            btn.classList.remove('loading');
            // Shake animation on the card
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            requestAnimationFrame(() => {
              card.style.animation = '';
            });
          }
        }, 300);
      });
    })();
  </script>
</body>
</html>
