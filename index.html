<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lumina – Plataforma educacional. Faça login como aluno, professor ou coordenação." />
  <title>Lumina – Login</title>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page login-page--split">

  <div class="login-split">

  <!-- Mascot (hidden on mobile) -->
  <div class="login-split-mascot">
    <div class="mascot-container">
      <svg class="mascot-float" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="140" height="175" aria-label="Lumi, mascote do Lumina" role="img">
        <!-- Body -->
        <ellipse cx="60" cy="105" rx="28" ry="22" fill="#6366f1"/>
        <!-- Head -->
        <circle cx="60" cy="65" r="30" fill="#fbbf24"/>
        <!-- Star accent on head -->
        <polygon points="60,38 63,48 73,48 65,54 68,64 60,58 52,64 55,54 47,48 57,48" fill="#f59e0b" opacity="0.7"/>
        <!-- Eyes -->
        <ellipse class="mascot-blink" cx="50" cy="62" rx="5" ry="6" fill="#1e1b4b"/>
        <ellipse class="mascot-blink" cx="70" cy="62" rx="5" ry="6" fill="#1e1b4b"/>
        <!-- Eye shine -->
        <circle cx="52" cy="60" r="2" fill="white"/>
        <circle cx="72" cy="60" r="2" fill="white"/>
        <!-- Smile -->
        <path d="M 48 74 Q 60 84 72 74" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Left arm (static) -->
        <line x1="32" y1="100" x2="14" y2="118" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
        <!-- Right arm (waving) -->
        <g class="mascot-wave" style="transform-origin: 88px 100px;">
          <line x1="88" y1="100" x2="106" y2="82" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
        </g>
        <!-- Feet -->
        <ellipse cx="48" cy="126" rx="10" ry="6" fill="#4f46e5"/>
        <ellipse cx="72" cy="126" rx="10" ry="6" fill="#4f46e5"/>
      </svg>
      <p class="mascot-label">Olá! Eu sou a Lumi! ✨</p>
    </div>
  </div>

  <main class="login-card" role="main">

    <!-- Logo / branding -->
    <div class="login-logo">
      <div class="login-logo-icon" aria-hidden="true">
        <!-- Lumina star icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
             stroke-linejoin="round" width="32" height="32">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <h1>Lumina</h1>
      <p>Plataforma educacional</p>
    </div>

    <!-- Role selector tabs -->
    <div class="role-tabs" role="tablist" aria-label="Tipo de acesso">
      <button class="role-tab" data-role="student"      role="tab" aria-selected="false" type="button">Aluno</button>
      <button class="role-tab role-tab--active" data-role="teacher" role="tab" aria-selected="true"  type="button">Professor</button>
      <button class="role-tab" data-role="coordination" role="tab" aria-selected="false" type="button">Coordenação</button>
    </div>

    <!-- Error message (hidden initially) -->
    <div id="login-error" class="login-error" role="alert" aria-live="polite" hidden></div>

    <!-- Login form -->
    <form id="login-form" class="login-form" novalidate autocomplete="on">

      <input type="hidden" id="role" name="role" value="teacher" />

      <div class="form-group">
        <label for="username">Usuário</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ex.: ana.silva"
            autocomplete="username"
            required
            aria-required="true"
            aria-describedby="username-hint"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
            aria-required="true"
          />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Mostrar senha">
            <!-- Eye icon -->
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (hidden by default) -->
            <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Entrar</span>
      </button>

    </form>

    <!-- Demo credentials hint -->
    <div class="demo-hint" id="demo-hint" aria-label="Credenciais de demonstração">
      <p>🔑 Credenciais de demonstração:</p>
      <p><code>ana.silva</code> / <code>senha123</code></p>
      <p><code>carlos.mendes</code> / <code>senha456</code></p>
      <p><code>beatriz.costa</code> / <code>senha789</code></p>
    </div>

  </main>

  </div><!-- /.login-split -->

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /**
     * Login page controller.
     * Handles form submission, loading state, show/hide password, role tabs.
     */
    (function () {
      'use strict';

      // Redirect if any role session already exists
      if (Auth.getCurrentUser('teacher')) {
        window.location.replace('dashboard.html');
      } else if (Auth.getCurrentUser('student')) {
        window.location.replace('student-dashboard.html');
      } else if (Auth.getCurrentUser('coordination')) {
        window.location.replace('coordination.html');
      }

      const ROLE_DASHBOARDS = {
        teacher:     'dashboard.html',
        student:     'student-dashboard.html',
        coordination: 'coordination.html',
      };

      const DEMO_CREDENTIALS = {
        teacher: [
          ['ana.silva',     'senha123'],
          ['carlos.mendes', 'senha456'],
          ['beatriz.costa', 'senha789'],
        ],
        student: [
          ['aluno.lucas',  'aluno123'],
          ['aluno.marina', 'aluno123'],
        ],
        coordination: [
          ['coord', 'coord123'],
        ],
      };

      const form       = document.getElementById('login-form');
      const btn        = document.getElementById('login-btn');
      const errorEl    = document.getElementById('login-error');
      const pwInput    = document.getElementById('password');
      const roleInput  = document.getElementById('role');
      const demoHint   = document.getElementById('demo-hint');
      const toggleBtn  = document.getElementById('toggle-pw');
      const eyeIcon    = document.getElementById('eye-icon');
      const eyeOffIcon = document.getElementById('eye-off-icon');

      /* Role tabs */
      document.querySelectorAll('.role-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.role-tab').forEach((t) => {
            t.classList.remove('role-tab--active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('role-tab--active');
          tab.setAttribute('aria-selected', 'true');
          const role = tab.dataset.role;
          roleInput.value = role;
          updateDemoHint(role);
          errorEl.hidden = true;
        });
      });

      function updateDemoHint(role) {
        const creds = DEMO_CREDENTIALS[role] || [];
        const lines = creds.map(([u, p]) => `<p><code>${u}</code> / <code>${p}</code></p>`).join('');
        demoHint.innerHTML = `<p>🔑 Credenciais de demonstração:</p>${lines}`;
      }

      /* Show/hide password */
      toggleBtn.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type             = isHidden ? 'text' : 'password';
        eyeIcon.style.display    = isHidden ? 'none' : '';
        eyeOffIcon.style.display = isHidden ? ''     : 'none';
        toggleBtn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
      });

      /* Form submit */
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = pwInput.value;
        const role     = roleInput.value;

        btn.disabled = true;
        btn.classList.add('loading');
        errorEl.hidden = true;

        setTimeout(() => {
          const result = Auth.login(username, password, role);

          if (result.success) {
            window.location.href = ROLE_DASHBOARDS[role] || 'dashboard.html';
          } else {
            errorEl.textContent = result.error;
            errorEl.hidden      = false;
            btn.disabled        = false;
            btn.classList.remove('loading');
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            requestAnimationFrame(() => { card.style.animation = ''; });
          }
        }, 300);
      });
    })();
  </script>
</body>
</html>
