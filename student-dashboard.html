<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lumina – Portal do Aluno. Acesse seus vídeos, quizzes e acompanhe seu desempenho." />
  <title>Lumina – Portal do Aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar sidebar--student" id="sidebar" role="navigation" aria-label="Menu principal">
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">
          <!-- small mascot SVG 28px star -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="20" height="20">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Lumina</div>
          <div class="brand-tag">Portal do Aluno</div>
        </div>
      </div>
      <nav class="sidebar-nav" aria-label="Seções">
        <div class="nav-section-label">Principal</div>
        <div class="nav-item" data-view="welcome" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Início</span>
        </div>
        <div class="nav-section-label">Conteúdo</div>
        <div class="nav-item" data-view="videos" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <span>Meus Vídeos</span>
        </div>
        <div class="nav-item" data-view="quizzes" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Quizzes</span>
        </div>
        <div class="nav-section-label">Desempenho</div>
        <div class="nav-item" data-view="performance" role="button" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Meu Desempenho</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-teacher">
          <div class="teacher-avatar student-avatar" aria-hidden="true">
            <span data-student-avatar></span>
          </div>
          <div class="teacher-info">
            <div class="name" data-student-name>…</div>
            <div class="subject" data-student-class>…</div>
          </div>
          <button class="logout-btn" id="logout-btn" title="Sair" aria-label="Sair da conta">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <div class="main-wrapper">
      <header class="topbar topbar--student" role="banner">
        <button id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">Portal do Aluno</span>
        <div class="topbar-actions">
          <div class="topbar-avatar student-avatar" aria-hidden="true">
            <span data-student-avatar></span>
          </div>
          <span class="topbar-name" data-student-name></span>
        </div>
      </header>
      <main id="main-content" role="main" aria-live="polite">
        <p class="loading-message">Carregando…</p>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/student-app.js"></script>
  <script>
    document.querySelectorAll('.nav-item[role="button"]').forEach((el) => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
      });
    });
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    if (menuToggle && sidebar) {
      const observer = new MutationObserver(() => {
        menuToggle.setAttribute('aria-expanded', sidebar.classList.contains('sidebar--open').toString());
      });
      observer.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
    }
  </script>
</body>
</html>
