<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lumina – Dashboard do professor. Gerencie suas turmas, vídeos e quizzes." />
  <title>Lumina – Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="dashboard-layout">

    <!-- =================== Sidebar =================== -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menu principal">

      <!-- Brand -->
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" width="20" height="20">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Lumina</div>
          <div class="brand-tag">Plataforma Educacional</div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="sidebar-nav" aria-label="Seções">
        <div class="nav-section-label">Principal</div>

        <div class="nav-item" data-view="welcome" role="button" tabindex="0" aria-label="Visão geral">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Visão Geral</span>
        </div>

        <div class="nav-section-label">Conteúdo</div>

        <div class="nav-item" data-view="classes" role="button" tabindex="0" aria-label="Minhas turmas">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Turmas</span>
        </div>

        <div class="nav-item" data-view="videos" role="button" tabindex="0" aria-label="Vídeos didáticos">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" width="18" height="18">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          <span>Vídeos</span>
        </div>

        <div class="nav-item" data-view="quizzes" role="button" tabindex="0" aria-label="Quizzes interativos">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span>Quizzes</span>
        </div>
      </nav>

      <!-- Teacher info footer -->
      <div class="sidebar-footer">
        <div class="sidebar-teacher">
          <div class="teacher-avatar" aria-hidden="true">
            <span data-teacher-avatar></span>
          </div>
          <div class="teacher-info">
            <div class="name"    data-teacher-name>…</div>
            <div class="subject" data-teacher-subject>…</div>
          </div>
          <button class="logout-btn" id="logout-btn" title="Sair" aria-label="Sair da conta">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

    </aside>

    <!-- Mobile overlay backdrop -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- =================== Main =================== -->
    <div class="main-wrapper">

      <!-- Top bar -->
      <header class="topbar" role="banner">
        <!-- Mobile hamburger -->
        <button id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" width="22" height="22">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <span class="topbar-title">Lumina</span>

        <div class="topbar-actions">
          <div class="topbar-avatar" aria-hidden="true">
            <span data-teacher-avatar></span>
          </div>
          <span class="topbar-name" data-teacher-name></span>
        </div>
      </header>

      <!-- Dynamic content area -->
      <main id="main-content" role="main" aria-live="polite">
        <!-- Content is injected by app.js -->
        <p style="text-align:center;padding:4rem;color:var(--color-text-muted)">Carregando…</p>
      </main>

    </div><!-- /.main-wrapper -->

  </div><!-- /.dashboard-layout -->

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <!-- Keyboard navigation for sidebar nav items -->
  <script>
    document.querySelectorAll('.nav-item[role="button"]').forEach((el) => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          el.click();
        }
      });
    });

    // Update aria-expanded on menu toggle
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar    = document.getElementById('sidebar');
    if (menuToggle && sidebar) {
      const observer = new MutationObserver(() => {
        menuToggle.setAttribute('aria-expanded', sidebar.classList.contains('sidebar--open').toString());
      });
      observer.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
    }
  </script>
</body>
</html>
